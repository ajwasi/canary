<label for="name">Name</label>
<input type="text" id="name" name="name" maxlength="100" required value="{{ item.name if item else '' }}">
{% if kind == "locations" %}
<label for="address">Address</label>
<input type="text" id="address" name="address" maxlength="300" value="{{ item.address if item else '' }}">
<label for="timezone_name">Time zone</label>
<input type="text" id="timezone_name" name="timezone_name" list="tzlist" placeholder="For example America/Chicago" value="{{ item.timezone if item else '' }}">
<datalist id="tzlist">{% for tz in tz_names %}<option value="{{ tz }}">{% endfor %}</datalist>
{% endif %}
<label for="notes">Notes</label>
<textarea id="notes" name="notes">{{ item.notes if item else '' }}</textarea>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" font-family="Segoe UI, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#333"/></marker>
  </defs>
  <rect width="1100" height="430" fill="#ffffff"/>
  <text x="30" y="34" font-size="18" font-weight="700" fill="#111">System overview</text>

  <!-- Button unit -->
  <rect x="30" y="60" width="330" height="340" rx="10" fill="#fffde7" stroke="#333" stroke-width="1.5"/>
  <text x="46" y="84" font-weight="700" font-size="14" fill="#111">Button unit (A22NZ-A-B01Y box)</text>
  <rect x="50" y="104" width="130" height="50" rx="6" fill="#fff8e1" stroke="#333"/><text x="115" y="126" text-anchor="middle" font-weight="700" fill="#111">A22N switch</text><text x="115" y="142" text-anchor="middle" fill="#333">NO (+ NC) contacts</text>
  <rect x="50" y="184" width="130" height="50" rx="6" fill="#e3f2fd" stroke="#333"/><text x="115" y="206" text-anchor="middle" font-weight="700" fill="#111">Opto inputs</text><text x="115" y="222" text-anchor="middle" fill="#333">5 V, 11.5 mA wetting</text>
  <rect x="210" y="164" width="130" height="90" rx="6" fill="#e8f5e9" stroke="#333"/><text x="275" y="196" text-anchor="middle" font-weight="700" fill="#111">XIAO ESP32-C5</text><text x="275" y="213" text-anchor="middle" fill="#333">firmware, keys,</text><text x="275" y="229" text-anchor="middle" fill="#333">offline press queue</text>
  <rect x="210" y="284" width="130" height="50" rx="6" fill="#fce4ec" stroke="#333"/><text x="275" y="306" text-anchor="middle" font-weight="700" fill="#111">MAX98357A</text><text x="275" y="322" text-anchor="middle" fill="#333">amp + speaker</text>
  <rect x="50" y="284" width="130" height="50" rx="6" fill="#f5f5f5" stroke="#333"/><text x="115" y="306" text-anchor="middle" font-weight="700" fill="#111">5 V supply</text><text x="115" y="322" text-anchor="middle" fill="#333">USB-C, 2 A</text>
  <line x1="115" y1="154" x2="115" y2="182" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="180" y1="209" x2="208" y2="209" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="275" y1="254" x2="275" y2="282" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="283" y="272" font-size="10" fill="#555">I2S</text>
  <text x="46" y="366" fill="#333">Setup mode: the unit becomes a WPA2 access</text>
  <text x="46" y="382" fill="#333">point with a setup web page at 192.168.4.1.</text>

  <!-- Network -->
  <rect x="430" y="150" width="170" height="120" rx="10" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
  <text x="515" y="180" text-anchor="middle" font-weight="700" font-size="14" fill="#111">Site Wi-Fi</text>
  <text x="515" y="200" text-anchor="middle" fill="#333">WPA2 / WPA3 only</text>
  <text x="515" y="217" text-anchor="middle" fill="#333">5 GHz preferred,</text>
  <text x="515" y="233" text-anchor="middle" fill="#333">2.4 GHz fallback</text>
  <text x="515" y="256" text-anchor="middle" fill="#555" font-size="10">then the internet</text>
  <line x1="360" y1="209" x2="428" y2="209" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="600" y1="209" x2="668" y2="209" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Server -->
  <rect x="670" y="60" width="400" height="340" rx="10" fill="#e8eaf6" stroke="#333" stroke-width="1.5"/>
  <text x="686" y="84" font-weight="700" font-size="14" fill="#111">Server (one public host name)</text>
  <rect x="690" y="104" width="170" height="64" rx="6" fill="#fff" stroke="#333"/><text x="775" y="126" text-anchor="middle" font-weight="700" fill="#111">MQTT broker :8883</text><text x="775" y="143" text-anchor="middle" fill="#333">TLS + client certificate</text><text x="775" y="159" text-anchor="middle" fill="#333">presses, status, commands</text>
  <rect x="880" y="104" width="170" height="64" rx="6" fill="#fff" stroke="#333"/><text x="965" y="126" text-anchor="middle" font-weight="700" fill="#111">HTTPS :443</text><text x="965" y="143" text-anchor="middle" fill="#333">enrolment, firmware</text><text x="965" y="159" text-anchor="middle" fill="#333">and audio downloads, UI</text>
  <rect x="690" y="198" width="170" height="64" rx="6" fill="#fff" stroke="#333"/><text x="775" y="220" text-anchor="middle" font-weight="700" fill="#111">API + database</text><text x="775" y="237" text-anchor="middle" fill="#333">people, locations,</text><text x="775" y="253" text-anchor="middle" fill="#333">buttons, press log</text>
  <rect x="880" y="198" width="170" height="64" rx="6" fill="#fff" stroke="#333"/><text x="965" y="220" text-anchor="middle" font-weight="700" fill="#111">Device CA</text><text x="965" y="237" text-anchor="middle" fill="#333">30-day client certificates,</text><text x="965" y="253" text-anchor="middle" fill="#333">renewed over MQTT</text>
  <text x="686" y="300" fill="#333">Server certificate: public CA, auto-renewed.</text>
  <text x="686" y="318" fill="#333">Devices trust the root list built into firmware,</text>
  <text x="686" y="336" fill="#333">so server renewals need no device change.</text>
  <text x="686" y="366" fill="#333">The server is in server/; docs/protocol.md</text>
  <text x="686" y="382" fill="#333">is the contract between the two.</text>
</svg>

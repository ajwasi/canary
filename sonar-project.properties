# SonarCloud (automatic analysis reads this file).
sonar.projectKey=ajwasi_canary
sonar.organization=ajwasi

# docs/mocks is generated by server/tools/make_mocks.py from the real pages (server/app/templates and
# firmware/main/portal.html) and holds screenshots. Those sources are analysed; the generated copies repeat
# the same markup by design, so they are left out.
sonar.exclusions=docs/mocks/**
sonar.cpd.exclusions=docs/mocks/**

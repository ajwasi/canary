per_listener_settings true
persistence true
persistence_location /mosquitto/data/
log_dest stdout

# Internal listener for the server app. Reachable only inside the compose network.
listener 1883
allow_anonymous true

# Buttons: TLS with a client certificate from the device CA.
# The certificate's common name (the serial) becomes the user name.
listener 8883
certfile /certs/server.crt
keyfile /certs/server.key
cafile /certs/device-ca.pem
require_certificate true
use_identity_as_username true
allow_anonymous false
tls_version tlsv1.2
acl_file /mosquitto/config/devices.acl

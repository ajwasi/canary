<h1>Updates</h1>

<div class="two">
  <div class="card">
    <h2>Firmware</h2>
    <div class="tablewrap"><table>
      <thead><tr><th>Version</th><th class="num">Size</th><th>Uploaded</th><th></th></tr></thead>
      <tbody>
      
      <tr><td>0.2.0</td><td class="num">1152 KB</td><td>2026-11-23 17:34:44 EST</td>
        <td><form onsubmit="return false" method="post" action="/updates/firmware/1/delete"><input type="hidden" name="csrf" value="D0hgwjZHwWXwaeDV_axCWSN7n-cjj9Ai"><button class="link">Delete</button></form></td></tr>
      
      </tbody>
    </table></div>
    
    <form onsubmit="return false" method="post" action="/updates/firmware" enctype="multipart/form-data">
      <input type="hidden" name="csrf" value="D0hgwjZHwWXwaeDV_axCWSN7n-cjj9Ai">
      <label for="version">Version</label><input type="text" id="version" name="version" maxlength="31" required placeholder="Must match the version built into the file">
      <label for="fwfile">Signed image (.bin)</label><input type="file" id="fwfile" name="file" accept=".bin" required>
      <button>Upload firmware</button>
    </form>
    
  </div>
  <div class="card">
    <h2>Press sounds</h2>
    <div class="tablewrap"><table>
      <thead><tr><th>Name</th><th class="num">Size</th><th>Uploaded</th><th></th></tr></thead>
      <tbody>
      
      <tr><td><a href="#">Soft chime</a></td><td class="num">47 KB</td><td>2026-11-23 17:34:44 EST</td>
        <td><form onsubmit="return false" method="post" action="/updates/audio/1/delete"><input type="hidden" name="csrf" value="D0hgwjZHwWXwaeDV_axCWSN7n-cjj9Ai"><button class="link">Delete</button></form></td></tr>
      
      </tbody>
    </table></div>
    
    <form onsubmit="return false" method="post" action="/updates/audio" enctype="multipart/form-data">
      <input type="hidden" name="csrf" value="D0hgwjZHwWXwaeDV_axCWSN7n-cjj9Ai">
      <label for="clipname">Name</label><input type="text" id="clipname" name="name" maxlength="100">
      <label for="wavfile">WAV file (16-bit PCM, up to 1.5 MB)</label><input type="file" id="wavfile" name="file" accept=".wav" required>
      <button>Upload sound</button>
    </form>
    
  </div>
</div>

    <fieldset>

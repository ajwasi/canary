<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Problem</title>
<style>:root {
  --bg: #f5f4f0; --panel: #ffffff; --ink: #1d1f23; --muted: #646a73; --line: #dcdad3;
  --accent: #1f5fbf; --accent-ink: #ffffff; --ok: #1e8a4c; --off: #9aa0a8; --warn: #b45309; --bad: #b3261e;
  --flash: #e6f0ff; --series: #2a78d6; --grid: #e6e4de;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15171a; --panel: #1f2226; --ink: #e8e9eb; --muted: #9ba1aa; --line: #33373d;
    --accent: #6ea4f4; --accent-ink: #10131a; --ok: #4cc27e; --off: #6b717a; --warn: #e0a04a; --bad: #f0857d;
    --flash: #1d2b44; --series: #3987e5; --grid: #2b2f35;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, "Segoe UI", sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

header.top { background: var(--panel); border-bottom: 1px solid var(--line); }
header.top .bar { max-width: 1100px; margin: 0 auto; padding: 0 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 18px; }
header.top .brand { font-weight: 700; padding: 12px 0; margin-right: 8px; color: var(--ink); }
header.top nav { display: flex; flex-wrap: wrap; gap: 2px; flex: 1; }
header.top nav a { padding: 12px 10px; color: var(--muted); border-bottom: 2px solid transparent; }
header.top nav a.on { color: var(--ink); border-bottom-color: var(--accent); }
header.top form { margin: 0; }

main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 48px; }
h1 { font-size: 24px; margin: 4px 0 16px; }
h2 { font-size: 17px; margin: 0 0 10px; }
.sub { color: var(--muted); font-size: 13px; }
.head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.grid .card { margin: 0; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; align-items: start; }

.flash { background: var(--flash); border: 1px solid var(--accent); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; overflow-wrap: anywhere; }
.error { color: var(--bad); margin: 8px 0; }

.tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 16px; }
.tabs a { padding: 6px 14px; color: var(--muted); background: var(--panel); }
.tabs a.on { background: var(--accent); color: var(--accent-ink); }

.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.time { white-space: nowrap; font-variant-numeric: tabular-nums; }

.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--off); margin-right: 6px; }
.dot.on { background: var(--ok); }
.dot.bad { background: var(--bad); }
.tag { display: inline-block; font-size: 12px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); margin-left: 4px; white-space: nowrap; }
.tag.warn { color: var(--warn); border-color: var(--warn); }
.tag.bad { color: var(--bad); border-color: var(--bad); }

.btnrow { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.btnrow:first-of-type { border-top: 0; }
.btnrow .right { text-align: right; color: var(--muted); font-size: 13px; white-space: nowrap; }

label { display: block; font-weight: 600; font-size: 13px; margin: 10px 0 3px; }
input[type=text], input[type=email], input[type=password], input[type=date], input[type=file], select, textarea {
  width: 100%; padding: 8px 10px; font: inherit; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px;
}
textarea { min-height: 70px; }
button, .button { display: inline-block; font: inherit; font-weight: 600; padding: 8px 14px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); margin-top: 12px; }
button.plain { background: transparent; color: var(--accent); }
button.danger { background: transparent; color: var(--bad); border-color: var(--bad); }
button.link { border: 0; background: none; color: var(--muted); padding: 12px 0; margin: 0; font-weight: 400; }
td button.link { padding: 0; }
.inline { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
.inline > div { flex: 1; min-width: 140px; }
.inline button { margin-top: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.actions form { margin: 0; }
.check { display: flex; align-items: center; gap: 8px; font-weight: 400; margin: 6px 0; }
.check input { width: auto; }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
dt { color: var(--muted); }
dd { margin: 0; overflow-wrap: anywhere; }
.pager { display: flex; gap: 14px; align-items: center; margin-top: 12px; color: var(--muted); }
.login { max-width: 360px; margin: 9vh auto 0; }
.qr svg { background: #fff; border-radius: 6px; max-width: 220px; height: auto; }
.empty { color: var(--muted); padding: 8px 0; }

.presets { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 8px; }
.presets a { padding: 3px 11px; border: 1px solid var(--line); border-radius: 14px; color: var(--muted); font-size: 13px; }
.presets a.on { border-color: var(--accent); color: var(--ink); }
.stats { display: flex; flex-wrap: wrap; gap: 6px 36px; margin: 4px 0 10px; }
.stats b { display: block; font-size: 26px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.stats span { color: var(--muted); font-size: 13px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; }
.chart .grid { stroke: var(--grid); stroke-width: 1; }
.chart .grid.base { stroke: var(--line); }
.chart .axis { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.chart .bar { fill: var(--series); }
.chart .bar.lit { filter: brightness(1.18); }
.chart .hit { fill: transparent; }
.chart .tip { position: absolute; pointer-events: none; background: var(--panel); color: var(--ink); border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 10px; box-shadow: 0 4px 14px rgba(0, 0, 0, .14); white-space: nowrap; font-size: 13px; }
.chart .tip b { display: block; font-size: 15px; }
.chart .tip span { color: var(--muted); }
.chart-table { margin-top: 10px; }
.chart-table summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.chart-table .tablewrap { max-height: 320px; overflow-y: auto; margin-top: 8px; }
</style>
</head>
<body>

<main>


<div class="card login">
  <h1>That did not work</h1>
  <p>Your account does not have permission for this.</p>
  <p>Use your browser's Back button to return, or go to the <a href="overview-by-person.html">overview</a>.</p>
</div>

</main>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Sign in</title>
<link rel="stylesheet" href="../assets/app.css">
</head>
<body>

<main>


<div class="card login">
  <h1>Button Notifier</h1>
  
  <form onsubmit="return false" method="post" action="/login">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="" required autocomplete="username">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required autocomplete="current-password">
    <label for="code">Authenticator code</label>
    <input type="text" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" placeholder="Only if two-step sign-in is on">
    <button>Sign in</button>
  </form>
</div>

</main>
</body>
</html>

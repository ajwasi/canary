name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  server:
    name: Server tests and emulator end-to-end test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - run: pip install -q -r server/requirements-dev.txt
      - name: Server tests
        run: cd server && python -m pytest -q
      - name: End-to-end test with the Python emulator
        run: cd emulator && python -m pytest test_e2e.py -q

  firmware-esp32c5:
    name: Build firmware for the ESP32-C5
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.5
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          . "$IDF_PATH/export.sh"
          cd firmware
          idf.py set-target esp32c5
          idf.py build
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32c5
          path: |
            firmware/build/button_notifier.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flasher_args.json

  firmware-host-test:
    name: Run the firmware on Linux against the server
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.5
    steps:
      - uses: actions/checkout@v4
      - name: Python environment for the server and the test
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q -r server/requirements-dev.txt
      - name: Test root certificate
        run: /tmp/venv/bin/python emulator/test_ca.py firmware/host/test-ca
      - name: Build the firmware as a Linux program
        run: |
          . "$IDF_PATH/export.sh"
          cd firmware
          idf.py --preview set-target linux
          idf.py build
      - name: End-to-end test with the real firmware
        run: |
          export CANARY_TARGET=firmware
          export CANARY_FIRMWARE_ELF="$GITHUB_WORKSPACE/firmware/build/button_notifier.elf"
          export CANARY_TEST_CA="$GITHUB_WORKSPACE/firmware/host/test-ca"
          export CANARY_LOG="$GITHUB_WORKSPACE/firmware.log"
          cd emulator && /tmp/venv/bin/python -m pytest test_e2e.py -q
      - name: Firmware log
        if: always()
        run: test -f firmware.log && tail -n 400 firmware.log || echo "no firmware log"
